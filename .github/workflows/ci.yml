name: CI

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端（编译 + 回归）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 回归脚本里有 3 个 TS 用例（node --experimental-strip-types 直跑），
      # 其中 verify_log_dedupe.ts 会 import frontend/src/api/ws/index.ts → vue，
      # 必须安装前端依赖；Node 需 >= 22.6 才支持 --experimental-strip-types。
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装前端依赖（TS 回归需要 vue）
        run: npm install
        working-directory: frontend

      # _version.py 被 .gitignore 忽略：运行时的版本接口与回归脚本都依赖它
      - name: 生成版本文件（_version.py）
        run: python -X utf8 build/gen_version_file.py

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt

      # minidevice 未发布到 PyPI（见 backend/requirements.txt 注释）。
      # 安装失败不阻断：相关 MiniTouch 用例会自动 skip，不影响其余回归。
      - name: 安装 minidevice（可选）
        continue-on-error: true
        run: pip install "minidevice @ git+https://github.com/NakanoSanku/minidevice.git"

      - name: 静态检查（ruff）
        # 只开正确性规则（见根目录 ruff.toml）：未定义名/未使用导入/重复定义/
        # 重复字典键/裸 except/可变默认参数。compileall 查不出函数体内的 NameError。
        run: python -m ruff check backend

      - name: 编译检查（compileall）
        run: python -m compileall -q backend

      - name: 回归脚本（快速集）
        run: python -X utf8 test_scene/_run_verify_batch.py

      - name: 关键模块导入
        run: |
          python -c "import backend.main; print('backend.main import OK')"
          python -c "import backend.services.scheduler_service; print('scheduler import OK')"

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile || npm install

      - name: 类型检查（api / types / stores 白名单）
        run: npx tsc -p tsconfig.typecheck.json

      - name: 构建（产物 frontend/dist 由热更新分发，这里只验证可构建）
        run: npx vite build
