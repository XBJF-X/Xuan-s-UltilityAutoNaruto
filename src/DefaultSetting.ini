[助手设置]
# 自动更新开关，默认关闭
自动更新 = False
# 更新源：auto=自动（GitHub 优先、Gitee 兜底）/ github / gitee
更新源 = auto
# GitHub 个人访问令牌（PAT），默认留空 = 匿名调用。
# 匿名调用 api.github.com 限额很低（60 次/小时/IP），共用出口 IP 时「检查更新」
# 容易报 403 被限流；填入 PAT 后额度提升到 5000 次/小时。
# 只需读公开仓库：GitHub → Settings → Developer settings → Personal access tokens
# → Fine-grained tokens，仓库权限留空（或仅 Metadata: Read）即可。
GithubPAT = 
# 模拟器安装路径（优先于 Config JSON，留空则回退 Config 配置）
MuMu安装路径=
雷电安装路径=
# 错误/超时/异常自动截图（全局开关，默认开启）
错误自动截图 = True
# OCR 加速（DirectML GPU 推理，默认开启；需 onnxruntime-directml，GPU 不可用时自动回退 CPU）
OCR加速 = True
# 任务通知（预设跑完 / 账号配置模式执行告一段落时弹出系统通知，当前仅 Windows 生效）
任务通知 = True
# 启动提示（程序启动时弹出使用引导弹窗；在弹窗中勾选「不再提示」后自动置为 False，
# 想恢复提示可在「全局设置 → 助手设置」把该项改回 True）
启动提示 = True
# 连点间隔（毫秒）：连点器相邻两次点击的周期间隔，默认 230ms（与旧版行为一致）。
# 连点已改为"集中批量提交"，该值只决定点击节奏，不再决定通信往返次数，
# 因此调小不会显著增加开销；允许范围 20~2000，越界自动收敛。
连点间隔 = 230
