[助手设置]
# 自动更新开关，默认关闭
自动更新 = False
# 更新源：auto=自动（Gitee 优先、GitHub 兜底，适应国内网络）/ github / gitee
更新源 = auto
# 模拟器安装路径（优先于 Config JSON，留空则回退 Config 配置）
MuMu安装路径=
雷电安装路径=
# 错误/超时/异常自动截图（全局开关，默认开启）
错误自动截图 = True
# OCR 加速（DirectML GPU 推理，默认开启；需 onnxruntime-directml，GPU 不可用时自动回退 CPU）
OCR加速 = True
# 任务通知（预设跑完 / 账号配置模式执行告一段落时弹出系统通知，当前仅 Windows 生效）
任务通知 = True
# 启动提示（程序启动时弹出使用引导弹窗；在弹窗中勾选「不再提示」后自动置为 False，
# 想恢复提示可在「全局设置 → 助手设置」把该项改回 True）
启动提示 = True
